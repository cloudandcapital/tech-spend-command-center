name: PR Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run black --check tech_spend_command_center tests
      - run: uv run isort --check-only tech_spend_command_center tests
      - run: uv run flake8 tech_spend_command_center tests --count --select=E9,F63,F7,F82,F401 --show-source --statistics
      - run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/runtime-requirements.txt
          uv run pip-audit --cache-dir /tmp/pip-audit-cache --requirement /tmp/runtime-requirements.txt

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run pytest tests/ -q

  package:
    name: Package smoke test
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
      - run: uv build --out-dir dist
      - run: |
          python -m venv package-smoke
          uv pip install --python package-smoke/bin/python dist/*.whl
          package-smoke/bin/techspend --version

  ccac-1-1:
    name: Released CCAC 1.1 pipeline
    runs-on: ubuntu-latest
    needs: [quality, test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - run: |
          uv venv /tmp/command-center-integration
          uv pip install --python /tmp/command-center-integration/bin/python . \
            'git+https://github.com/cloudandcapital/finops-lite.git@d72649ec07aa57c60a7ea3f8ff2890b8d95c4b93' \
            'git+https://github.com/cloudandcapital/finops-watchdog.git@9bc4e90725969f7775b3aef110b01e10dec4a7e0' \
            'git+https://github.com/cloudandcapital/recovery-economics.git@9a6c4e1ce34e58af10fc42d44d911338a724dabe' \
            'git+https://github.com/cloudandcapital/ai-cost-lens.git@c4ab27a5c83ca7165de130a08c5d118fd18887b2' \
            'git+https://github.com/cloudandcapital/saas-cost-analyzer.git@a627aff595eb0c0fc44f23a07662cfd82cc98bbe'
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.2.0 --repo cloudandcapital/cloud-capital-analysis-contract --pattern '*.whl' --dir /tmp
          echo 'bc46f363b1a03c94cf0da75759bccd0271de2c53b1f77a1a7255f9c8e7f768f1  /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl' | sha256sum --check
          uv pip install --python /tmp/command-center-integration/bin/python /tmp/cloudandcapital_ccac-0.2.0-py3-none-any.whl
      - run: |
          /tmp/command-center-integration/bin/techspend demo-pipeline --contract-version 1.1.0 --output-dir /tmp/run-a
          /tmp/command-center-integration/bin/techspend demo-pipeline --contract-version 1.1.0 --output-dir /tmp/run-b
          diff -r /tmp/run-a /tmp/run-b
          for artifact in /tmp/run-a/*.json; do /tmp/command-center-integration/bin/ccac validate "$artifact"; done
          /tmp/command-center-integration/bin/ccac validate-run /tmp/run-a
          /tmp/command-center-integration/bin/techspend summarize /tmp/run-a
